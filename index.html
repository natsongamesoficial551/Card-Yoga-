<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alessandra Gomes - Yoga Teacher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barrio&family=Bebas+Neue&family=Cookie&family=DM+Serif+Display:ital@0;1&family=DynaPuff:wght@400..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Knewave&family=Libertinus+Keyboard&family=Limelight&family=Monoton&family=Permanent+Marker&family=Press+Start+2P&family=Rubik+Distressed&family=Workbench&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Serif+Display:ital@0;1&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        /* ===== PALETA DE CORES ===== */
        :root {
            --color-background: #a1a199;
            --color-title: #9a7c33;
            --color-subtitle: #dbd1c7;
            --color-button-text: #f0ede8;
            --color-details: #cdc1b3;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY COM FUNDO ===== */
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: #333;
            transition: all 0.5s ease;
        }

        /* Camada de fundo com imagem */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./assets/fundo\ 2.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -2;
        }

        /* Camada de overlay com cor */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-background);
            opacity: 0.92;
            z-index: -1;
        }

        /* ===== LAYOUT PRINCIPAL ===== */
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            animation: slideDown 0.8s ease-out;
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(205, 193, 179, 0.3);
        }

        @font-face {
    font-family: 'Brittany';
    src: url('./fonts/Brittany.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: 'CanvaSans';
    src: url('./fonts/Canva-Sans-Regular.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo/Brand */
        .brand {
            font-family: "DM Serif Display", serif;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--color-title);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        /* Controles */
        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        /* Toggle de Idioma */
        .language-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--color-details);
            backdrop-filter: blur(10px);
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--color-subtitle);
            cursor: pointer;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: var(--color-title);
            color: var(--color-button-text);
            box-shadow: 0 2px 8px rgba(154, 124, 51, 0.3);
        }

        .lang-btn:hover {
            background: var(--color-details);
            color: var(--color-button-text);
        }

        /* ===== CONTEÚDO CENTRAL ===== */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 100px 20px;
            gap: 80px;
            animation: fadeInUp 1s ease-out 0.3s both;
            flex: 1;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== PERFIL ===== */
        .profile {
            text-align: center;
            max-width: 600px;
            position: relative;
            z-index: 20;
        }

        .profile-image-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 40px;
        }

        .profile-image-wrapper::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: linear-gradient(135deg, var(--color-title), var(--color-details), var(--color-subtitle));
            border-radius: 50%;
            animation: rotate 8s linear infinite;
            opacity: 0.6;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-title), var(--color-details));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: white;
            box-shadow: 0 12px 40px rgba(161, 161, 153, 0.4);
            position: relative;
            z-index: 1;
            border: 4px solid rgba(255, 255, 255, 0.8);
            transition: all 0.5s ease;
        }

        .profile-image:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .profile h1 {
            font-family: "DM Serif Display", serif;
            font-style: italic;
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--color-title);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
            letter-spacing: 3px;
            line-height: 1.2;
        }

        .profile .subtitle {
            font-family: 'CanvaSans', sans-serif;
            font-style: oblique;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--color-subtitle);
            margin-bottom: 28px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.05);
        }

        .profile .bio {
            font-family: 'CanvaSans', sans-serif;
            font-size: 21px;
            line-height: 1.8;
            color: var(--color-subtitle);
            font-weight: 400;
            font-style: italic;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== LINKS ===== */
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
            margin-bottom: 80px;
            position: relative;
            z-index: 20;
        }

        .link-btn {
            font-family: 'Brittany', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 32px;
            background: #cdc1b3;
            backdrop-filter: blur(10px);
            border: 2px solid var(--color-details);
            border-radius: 26px;
            text-decoration: none;
            color: var(--color-button-text);
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--color-title);
            border-radius: 26px;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
            z-index: 0;
        }

        .link-btn:hover::before {
            width: 120%;
            height: 120%;
        }

        .link-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 56px rgba(154, 124, 51, 0.3);
            border-color: var(--color-title);
            color: var(--color-button-text);
        }

        .link-btn .icon {
            margin-right: 12px;
            font-size: 28px;
            position: relative;
            z-index: 1;
            transition: transform 0.4s ease;
            display: flex;
            align-items: center;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.1));
        }

        .link-btn:hover .icon {
            transform: scale(1.2) rotate(10deg);
        }

        .link-btn span:last-child {
            position: relative;
            font-size: 32px;
            z-index: 1;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.39);
        }

        /* Botão Primário */
        .link-btn.primary {
            background: #cdc1b3;
            border-color: var(--color-details);
            color: var(--color-button-text);
            box-shadow: 0 12px 32px rgba(154, 124, 51, 0.3);
            font-size: 18px;
            padding: 28px 36px;
        }

        .link-btn.primary::before {
            background: var(--color-title);
        }

        .link-btn.primary:hover {
            transform: translateY(-12px) scale(1.08);
            box-shadow: 0 24px 64px rgba(154, 124, 51, 0.4);
            color: var(--color-button-text);
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 48px 40px 36px 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            animation: slideUp 0.8s ease-out;
            margin-top: auto;
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            border-top: 1px solid rgba(205, 193, 179, 0.3);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .social-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--color-details);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--color-title);
            font-size: 24px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .social-btn svg {
            width: 26px;
            height: 26px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-btn:hover {
            transform: scale(1.08);
            background: var(--color-details);
            color: var(--color-button-text);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .social-btn:hover svg {
            transform: scale(1.15);
            animation: breathe 1.5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--color-title);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.4s ease;
        }

        .social-btn:hover::before {
            width: 120%;
            height: 120%;
        }

        .social-btn span {
            position: relative;
            z-index: 1;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.1));
        }

        .footer-text {
            text-align: center;
            font-size: 14px;
            color: var(--color-subtitle);
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 20px;
                flex-direction: column;
                gap: 16px;
            }

            .brand {
                font-size: 22px;
            }

            .content {
                padding: 50px 20px 70px 20px;
                gap: 56px;
            }

            .profile {
                padding: 0 16px;
            }

            .profile h1 {
                font-size: 40px;
                margin-bottom: 16px;
            }

            .profile .subtitle {
                font-size: 14px;
                letter-spacing: 3px;
                margin-bottom: 24px;
            }

            .profile .bio {
                font-size: 18px;
                line-height: 1.7;
                padding: 0 8px;
            }

            .profile-image-wrapper {
                width: 140px;
                height: 140px;
                margin-bottom: 32px;
            }

            .profile-image {
                width: 140px;
                height: 140px;
                font-size: 56px;
            }

            .links {
                grid-template-columns: 1fr;
                max-width: 100%;
                padding: 0 16px;
                gap: 18px;
                margin-bottom: 60px;
            }

            .link-btn {
                padding: 20px 28px;
                font-size: 15px;
            }

            .link-btn.primary {
                padding: 24px 32px;
                font-size: 16px;
            }

            .link-btn .icon {
                font-size: 26px;
                margin-right: 10px;
            }

            .link-btn:hover {
                transform: translateY(-6px) scale(1.03);
            }

            .link-btn.primary:hover {
                transform: translateY(-8px) scale(1.05);
            }

            .footer {
                padding: 36px 24px 28px 24px;
            }

            .social-links {
                gap: 14px;
                margin-bottom: 20px;
            }

            .social-btn {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }

            .social-btn:hover {
                transform: translateY(-4px) rotate(360deg);
            }

            .footer-text {
                font-size: 12px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .header {
                padding: 22px 32px;
            }

            .content {
                padding: 70px 32px 90px 32px;
                gap: 70px;
            }

            .profile h1 {
                font-size: 48px;
            }

            .profile .bio {
                font-size: 20px;
            }

            .profile-image-wrapper {
                margin-bottom: 36px;
            }

            .links {
                max-width: 700px;
                gap: 18px;
                padding: 0 20px;
                margin-bottom: 70px;
            }

            .link-btn {
                padding: 22px 30px;
                font-size: 15px;
            }

            .link-btn.primary {
                padding: 26px 34px;
                font-size: 17px;
            }

            .footer {
                padding: 44px 32px 32px 32px;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 40px 16px 60px 16px;
                gap: 44px;
            }

            .profile {
                padding: 0 12px;
            }

            .profile h1 {
                font-size: 34px;
                letter-spacing: 2px;
                margin-bottom: 14px;
            }

            .profile .subtitle {
                font-size: 13px;
                letter-spacing: 2px;
                margin-bottom: 20px;
            }

            .profile .bio {
                font-size: 16px;
                line-height: 1.6;
                padding: 0 4px;
            }

            .profile-image-wrapper {
                width: 120px;
                height: 120px;
                margin-bottom: 28px;
            }

            .profile-image {
                width: 120px;
                height: 120px;
                font-size: 48px;
            }

            .links {
                gap: 16px;
                margin-bottom: 50px;
                padding: 0 12px;
            }

            .link-btn {
                padding: 18px 24px;
                font-size: 14px;
                border-radius: 26px;
            }

            .link-btn.primary {
                padding: 22px 28px;
                font-size: 15px;
            }

            .link-btn .icon {
                font-size: 24px;
                margin-right: 8px;
            }

            .social-links {
                gap: 12px;
                margin-bottom: 18px;
            }

            .social-btn {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }

            .footer {
                padding: 32px 20px 24px 20px;
            }

            .controls {
                flex-direction: row;
                gap: 12px;
                width: 100%;
                justify-content: center;
            }
        }

        .icon img,
        .social-btn span img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.1));
        }

        .social-btn span img {
            width: 24px;
            height: 24px;
        }
    </style>
</head>

            <div class="brand">✦ Alessandra Gomes ✦</div>
            
            <div class="controls">

                    <button class="lang-btn active" data-lang="pt">PT</button>

                <p class="subtitle" data-i18n="subtitle">

    <script>
        const translations = {
            pt: {
                subtitle: 'Professora de Yoga',
                bio: 'Conecte-se com sua essência através do movimento consciente e da respiração',
                'btn-trial': 'Agende sua aula experimental',
                'btn-online': 'Pratique online comigo',
                'btn-whatsapp': 'Fale comigo no WhatsApp',
                'btn-sms': 'Envie uma mensagem (USA)'
            },
            en: {
                subtitle: 'Yoga Teacher',
                bio: 'Connect with your essence through mindful movement and breath',
                'btn-trial': 'Book a trial class',
                'btn-online': 'Practice online with me',
                'btn-whatsapp': 'Chat with me on WhatsApp',
                'btn-sms': 'Send me a text (USA)'
            }
        };

        let currentLang = 'pt';
        const langButtons = document.querySelectorAll('.lang-btn');
        
        langButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                
                langButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (translations[currentLang][key]) {
                        el.textContent = translations[currentLang][key];
                    }
                });
                
                document.documentElement.lang = currentLang;
            });
        });

        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const profile = document.querySelector('.profile');
            const links = document.querySelector('.links');
            
            if (profile) {
                profile.style.transform = `translateY(${scrolled * 0.3}px)`;
            }
            
            if (links) {
                links.style.transform = `translateY(${scrolled * 0.15}px)`;
            }
        });

        const observerOptions = {
            threshold: 0.2,
            rootMargin: '0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0) scale(1)';
                    }, index * 150);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.link-btn').forEach(btn => {
            btn.style.opacity = '0';
            btn.style.transform = 'translateY(30px) scale(0.9)';
            btn.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            observer.observe(btn);
        });

        console.log(`
        ✨ ALESSANDRA GOMES YOGA - BIO LINK ATUALIZADO ✨
        
        🎨 ALTERAÇÕES APLICADAS:
        - Cor dos botões: #cdc1b3 (sem opacidade)
        - Border-radius dos botões: 26px
        - Fundo transparente removido para mostrar a cor sólida
        
        📝 PRÓXIMOS PASSOS:
        - Adicione sua foto substituindo o caminho ./assets/Logo.jpg
        - Atualize os links dos botões (substituir #)
        - Adicione links das redes sociais nos href
        `);
    </script>
